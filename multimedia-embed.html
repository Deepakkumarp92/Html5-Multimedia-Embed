<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Embed</title>
    <style>
        body{
            background-color: lightcyan;
        }
        h4,div{
            text-align: center;
            margin: 22px 0;
            font-family: Arial;
        }
        a{
            text-decoration: none;
            background-color: gray;
            color: #fff;
            padding: 4px;
        }
    </style>
</head>

<body>

    <div style="background-color: #222; padding: 40px 0; color: #fff;">

        <h4>🔗 Anchor External Link - Same Page</h4>
        <a href="https://www.flipkart.com">Flipkart</a>
        <a href="https://www.amazon.com">Amazon</a>

        <h4>🌐 New Page</h4>
        <a href="https://www.learnvern.com" target="_blank">learnvern</a>
        <a href="https://www.swiggy.com" target="_blank">Swiggy</a>
        <a href="https://www.magicbricks.com" target="_blank">Magicbricks</a>
        <a href="https://www.canva.com" target="_blank">Canva</a>
    </div>

    <h4>🖼️ Embed Image</h4>

    <div>
        <img style="border: 4px solid orange;"
            src="https://i.pinimg.com/564x/e0/b8/5c/e0b85ca7e1132d57523244f699a60dc5.jpg" title="hello deepak" alt=""
            width="500px" height="350px">

        <h4>⚠️ Error Loading Image</h4>
        <img style="width: 600px; height: 400px; border: 4px solid red;"
            src="https://images.unsplash.com/photo-1617531653332-bd46c24f2068?q=80&w=1215&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="error loading image">
        <img style="width: 600px; height: 400px; border: 4px solid red;"
            src="https://.unsplash.com/photo-1617531653332-bd46c24f2068?q=80&w=1215&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="error loading image">
    </div>

    <h4>🎵 Embed Audio</h4>

    <div>
        <audio controls preload autoplay loop muted>
            <source src="Levitating(PagalWorld) (1).mp3" type="audio/mp3">
        </audio>
    </div>

    <h4>🎥 Embed Video</h4>

    <div>
        <video style="border: 4px solid red;" controls loop height="400px" poster="poster-image.jpg" src="videoplayback.mp4">
        </video>

        <video style="border: 4px solid yellow;" height="400px" controls preload autoplay loop muted>
            <source src="videoplayback.mp4" type="video/mp4">
        </video>
    </div>

    <h4>🌍 Embed External Website</h4>

    <div>
        <iframe style="border: 4px solid darkcyan;" src="https://www.wscubetech.com" width="600px"
            height="400px"></iframe>

        <iframe style="border: 4px solid blue;" width="600" height="400"
            src="https://www.youtube.com/embed/t0Q2otsqC4I?si=FlML_dkte-bRJdGQ" title="YouTube video player"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

    <h4>📢 Embed Advertisement Image</h4>

    <div>
        <iframe style="border: 4px solid hotpink;" width="1200px" height="400px"
            src="https://unblast.com/wp-content/uploads/2020/02/Business-Advertisement-Flyer-Template-1.jpg"></iframe>
    </div>

    <h4>🗺️ Embed Google Map</h4>

    <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3671.8726663301773!2d72.55642967509188!3d23.
        028447079169638!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xafc1c580caa14c1d%3A0x65c333cf63f206a!2sVibrant%20Technology!5e0!3m2!1sen!2sin!4v1726922443974!5m2!1sen!2sin"
        width="100%" height="400px" style="border: 4px solid black;" allowfullscreen="" loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"></iframe>

</body>
</html>
